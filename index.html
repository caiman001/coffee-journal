<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BeanDance">

    <meta name="theme-color" content="#000000">

    <title>BeanDance</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png?v=100">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png?v=100">
    <link rel="shortcut icon" href="icon.png?v=100">


    <style>
        :root {
            --bg-color: #000000;
            --card-width: 360px;
            --card-height: 580px;
            --gap: 24px;
            
            --glass-bg: rgba(28, 28, 30, 0.85);
            --glass-shadow: 0 40px 80px -10px rgba(0,0,0,0.9);
        }

        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        html, body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            width: 100vw; height: 100dvh;
            overflow: hidden;
            user-select: none; -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            position: fixed; inset: 0; z-index: 1;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        /* --- 搜索 UI --- */
        .search-overlay {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,0.01); 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 60px;
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .search-overlay.active { 
            opacity: 1; visibility: visible; pointer-events: auto; 
        }

        .search-capsule {
            width: var(--card-width);
            height: 60px;
            background: rgba(40, 40, 40, 0.6);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 30px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateY(-120%);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .search-overlay.active .search-capsule {
            transform: translateY(0);
        }

        .search-icon {
            width: 20px; height: 20px;
            stroke: rgba(255,255,255,0.6);
            margin-left: 20px; margin-right: 10px;
        }

        .search-input-box {
            flex: 1; height: 100%;
            background: transparent; border: none; outline: none;
            color: white; font-size: 20px; font-weight: 500;
            padding-right: 20px;
            font-family: inherit;
            caret-color: #D4A373;
        }
        .search-input-box::placeholder { color: transparent; }

        /* 滚动区域 */
        .card-scroller {
            display: flex;
            gap: var(--gap);
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            position: absolute;
            top: 50%; width: 100%; height: calc(var(--card-height) + 120px); 
            transform: translateY(-50%) translateZ(0);
            align-items: center;
            padding: 0; 
            opacity: 0; 
            transition: opacity 0.6s ease-out;
            will-change: opacity, scroll-position;
            overscroll-behavior-x: contain; /* 新增 */
        }
        .card-scroller.visible { opacity: 1; }
        .card-scroller::-webkit-scrollbar { display: none; }

        .card-scroller::before, .card-scroller::after {
            content: ''; display: block;
            flex: 0 0 calc(50vw - var(--card-width) / 2);
            width: calc(50vw - var(--card-width) / 2);
        }

        .card-wrapper {
            position: relative;
            flex: 0 0 var(--card-width);
            height: var(--card-height);
            scroll-snap-align: center;
            perspective: 2000px;
            z-index: 1;
            will-change: transform, opacity;
            transform: scale(0.88);
            opacity: 0.4;
        }
        .card-wrapper.active { z-index: 100; }

        /* --- 烘焙度色彩主题 --- */
        .card-wrapper {
            --roast: rgba(255,255,255,0.7);
            --roast-glow: rgba(255,255,255,0.05);
            --roast-stream: rgba(255,255,255,0.3);
        }
        .card-wrapper.roast-light {
            --roast: #E8C39E;
            --roast-glow: rgba(232,195,158,0.26);
            --roast-stream: rgba(232,195,158,0.55);
        }
        .card-wrapper.roast-medium {
            --roast: #C68B59;
            --roast-glow: rgba(198,139,89,0.26);
            --roast-stream: rgba(198,139,89,0.55);
        }
        .card-wrapper.roast-dark {
            --roast: #8C5A3C;
            --roast-glow: rgba(140,90,60,0.3);
            --roast-stream: rgba(140,90,60,0.6);
        }

        .card {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card-wrapper.flipped .card { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            border-radius: 40px; box-sizing: border-box;
            box-shadow: var(--glass-shadow);
            background: linear-gradient(160deg, #1a1a1a 0%, #050505 100%);
        }

        /* 优化：仅 Active 卡片显示流光，减少 GPU 压力 */
        .card-wrapper:not(.active) .card-front::after,
        .card-wrapper:not(.active) .card-back::after {
            animation: none; display: none;
        }

        .card-front::after, .card-back::after {
            content: ''; position: absolute; inset: 0; border-radius: 40px; padding: 1px;
            background: conic-gradient(from var(--angle), transparent 40%, var(--roast-stream) 50%, transparent 60%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none; z-index: 10;
            animation: spin 8s linear infinite;
        }
        @keyframes spin { to { --angle: 360deg; } }

        .card-front { overflow: hidden; z-index: 2; transform: rotateY(0deg) translateZ(0); }
        
        /* 无图时的烘焙度色调空状态 */
        .bg-placeholder {
            position: absolute; inset: 0; z-index: 0;
            background:
                radial-gradient(130% 90% at 50% -10%, var(--roast-glow) 0%, transparent 70%),
                linear-gradient(200deg, var(--roast-glow) 0%, transparent 60%);
        }

        .bg-image {
            position: absolute; 
            top: -1%; left: -1%; width: 102%; height: 102%; 
            object-fit: cover; 
            transition: opacity 0.5s ease; 
            background-color: #000; 
            z-index: 1;
            will-change: transform;
            -webkit-backface-visibility: hidden;
        }
        
        .overlay-gradient {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 60%;
            background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.4) 30%, rgba(0,0,0,0.95) 100%);
            z-index: 2; pointer-events: none;
            transform: scale(1.02); 
            transform-origin: bottom center;
        }

        .card-content {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
            display: flex; flex-direction: column; justify-content: flex-end; 
            padding-bottom: 50px; align-items: center; text-align: center;
        }
        .card-content input { pointer-events: auto; }

        .app-brand-title-input {
            background: transparent; border: none; outline: none;
            font-family: inherit; width: 100%; text-align: center; padding: 0;
            font-size: 42px; font-weight: 800; line-height: 0.9; letter-spacing: -1.5px;
            margin: 0; 
            background: linear-gradient(135deg, #fff 0%, #aaaaaa 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5); caret-color: #fff;
            color: white; 
        }
        .app-brand-author-input {
            background: transparent; border: none; outline: none;
            font-family: inherit; width: 100%; text-align: center; padding: 0;
            font-size: 10px; font-weight: 600; letter-spacing: 6px; 
            text-transform: uppercase; color: rgba(255,255,255,0.5);
            margin: 4px 0 0 0; 
            caret-color: #fff;
        }

        .card-content h2 { 
            margin: 0; font-size: 34px; font-weight: 700; color: rgba(255,255,255,0.95);
            line-height: 1.1; letter-spacing: -0.5px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .card-content p {
            margin: 8px 0 0 0; font-size: 13px; letter-spacing: 2px; font-weight: 500;
            color: var(--roast); text-transform: uppercase;
            font-variant-numeric: tabular-nums;
        }

        /* --- 上传按钮优化开始 --- */
        .upload-btn {
            position: absolute; top: 24px; right: 24px; 
            width: 50px; height: 50px; 
            /* 无图时：完全透明背景，无衬底 */
            background: transparent;
            display: flex; justify-content: center; align-items: center; z-index: 20;
            cursor: pointer; pointer-events: auto;
            /* 只有图标有过渡效果，容器一直存在 */
            transition: transform 0.2s ease;
        }
        
        .upload-btn svg { 
            stroke: white; width: 24px; height: 24px; stroke-width: 1.5; 
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.9));
            /* 关键：让点击穿透 SVG 到达 Label 容器 */
            pointer-events: none; 
            transition: opacity 0.3s ease;
            opacity: 1; /* 默认显示 */
        }

        /* 按下时的反馈，轻微缩放 */
        .upload-btn:active { transform: scale(0.9); }

        /* 有图时：
           1. 容器：背景设为极低透明度白色 (Safari Hack)，变成"空白帧"，保证可点击
           2. 图标：透明度设为 0，隐藏
        */
        .card-wrapper.has-image .upload-btn { 
            background: rgba(255,255,255,0.001); 
        }
        .card-wrapper.has-image .upload-btn svg { 
            opacity: 0; 
        }
        
        /* 有图时按下：让图标稍微显现，给用户反馈 */
        .card-wrapper.has-image .upload-btn:active svg {
            opacity: 0.5;
        }
        /* --- 上传按钮优化结束 --- */

        .card-back {
            transform: rotateY(180deg); z-index: 1;
            background: var(--glass-bg);
            backdrop-filter: blur(50px) saturate(180%); -webkit-backdrop-filter: blur(50px) saturate(180%);
            padding: 44px 30px 30px;
            display: flex; flex-direction: column; color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .back-scroll {
            flex: 1; min-height: 0;
            overflow-y: auto;
            scrollbar-width: none;
            margin-bottom: 14px;
        }
        .back-scroll::-webkit-scrollbar { display: none; }

        .title-input-group {
            margin-bottom: 30px; text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px; display: flex; align-items: center; justify-content: center; min-height: 40px; 
        }
        .title-input {
            width: 100%; background: transparent; border: none;
            font-size: 24px; font-weight: 700; color: white; text-align: center;
            outline: none; font-family: inherit; line-height: 1.2; padding: 0; margin: 0;
        }
        .title-input::placeholder { color: rgba(255,255,255,0.3); }

        .data-list { display: flex; flex-direction: column; gap: 0; width: 100%; margin-bottom: 20px; }
        .data-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.08); height: 24px;
        }
        .data-label { font-size: 15px; color: rgba(255,255,255,0.6); font-weight: 500; letter-spacing: 0.5px; }
        .data-value-group { display: flex; align-items: center; justify-content: flex-end; width: 140px; }
        .data-input {
            flex: 1; background: transparent; border: none; text-align: right; 
            color: white; font-size: 20px; font-weight: 600; outline: none; 
            font-family: "SF Pro Display", -apple-system, sans-serif; font-variant-numeric: tabular-nums; 
            padding: 0; margin: 0;
        }
        .data-unit {
            font-size: 14px; color: rgba(255,255,255,0.4); font-weight: 500;
            width: 25px; text-align: right; padding-left: 0; margin-left: 5px; flex-shrink: 0;
        }

        .data-input { caret-color: var(--roast); }
        .data-static {
            font-size: 20px; font-weight: 600; color: var(--roast);
            font-variant-numeric: tabular-nums;
        }
        .data-input.date-input {
            font-size: 15px; font-weight: 500;
            color-scheme: dark;
            -webkit-appearance: none; appearance: none;
        }
        .data-input.date-input::-webkit-calendar-picker-indicator { opacity: 0.4; }

        .roast-picker { display: flex; gap: 12px; justify-content: flex-end; align-items: center; }
        .roast-dot {
            width: 22px; height: 22px; border-radius: 50%;
            border: 2px solid transparent; cursor: pointer;
            opacity: 0.35; transition: all 0.2s; box-sizing: border-box;
        }
        .roast-dot.light { background: #E8C39E; }
        .roast-dot.medium { background: #C68B59; }
        .roast-dot.dark { background: #8C5A3C; }
        .roast-dot.selected { opacity: 1; border-color: rgba(255,255,255,0.9); transform: scale(1.1); }

        /* --- 冲煮历史 --- */
        .btn-brew {
            width: 100%; margin: 0 0 14px; padding: 13px 0;
            background: transparent; border: 1px solid var(--roast);
            color: var(--roast); border-radius: 24px;
            font-size: 13px; font-weight: 600; letter-spacing: 1px;
            cursor: pointer; font-family: inherit;
            transition: background 0.2s;
        }
        .btn-brew:active { background: var(--roast-glow); }

        .brew-list { margin-top: 2px; }
        .brew-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 13px; color: rgba(255,255,255,0.55);
            font-variant-numeric: tabular-nums;
        }
        .brew-date { color: rgba(255,255,255,0.35); margin-right: 10px; flex-shrink: 0; }
        .brew-params { flex: 1; text-align: right; margin-right: 12px; }
        .brew-del {
            color: rgba(255,255,255,0.25); font-size: 17px; padding: 0 4px;
            cursor: pointer; line-height: 1;
        }
        .brew-del:active { color: #FF453A; }
        .brew-empty {
            padding: 14px 0 4px; font-size: 12px; letter-spacing: 1px;
            color: rgba(255,255,255,0.25); text-align: center;
        }

        .action-row { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
        .btn-text { 
            background: rgba(255,255,255,0.08); border: none; color: white; 
            padding: 12px 24px; border-radius: 24px; font-size: 13px; font-weight: 500; cursor: pointer; 
            backdrop-filter: blur(10px); transition: background 0.2s;
        }
        .btn-text:active { background: rgba(255,255,255,0.15); }
        .btn-delete { background: rgba(255, 69, 58, 0.1); color: #FF453A; }
        .btn-delete:active { background: rgba(255, 69, 58, 0.2); }

        .card-add {
            background: rgba(255,255,255,0.02); position: relative;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: background 0.3s; border-radius: 40px; box-sizing: border-box; height: 100%; width: 100%;
        }
        .card-add::after {
            content: ''; position: absolute; inset: 0; border-radius: 40px;
            border: 1px dashed rgba(255,255,255,0.2); pointer-events: none;
        }
        .card-add:active { background: rgba(255,255,255,0.05); }
        
        .add-icon { 
            font-size: 60px; color: rgba(255,255,255,0.2); font-weight: 200; margin-bottom: 20px; pointer-events: none;
            transition: opacity 0.3s;
        }
        .card-add.active .add-icon { opacity: 0; display: none; }

        .add-roast-group {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; gap: 12px; width: 60%;
            z-index: 20; 
            visibility: hidden; opacity: 0; 
            transition: opacity 0.3s ease, visibility 0s linear 0.3s;
        }
        .card-add.active .add-roast-group { 
            visibility: visible; opacity: 1; 
            transition: opacity 0.3s ease, visibility 0s;
        }

        .add-menu-btn {
            background: rgba(255,255,255,0.08); padding: 16px; border-radius: 16px;
            text-align: center; color: white; font-weight: 600; font-size: 14px;
            backdrop-filter: blur(10px); cursor: pointer; border: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
        }
        .add-menu-btn:active { background: rgba(255,255,255,0.15); }
        
        .add-io-group {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 20px;
            z-index: 30; 
            visibility: hidden; opacity: 0;
            transition: opacity 0.3s ease, visibility 0s linear 0.3s;
        }
        .card-add.active .add-io-group { 
            visibility: visible; opacity: 1; 
            transition: opacity 0.3s ease, visibility 0s;
        }

        .btn-io {
            font-size: 11px; font-weight: 700; letter-spacing: 1px;
            color: rgba(255,255,255,0.3); padding: 8px 12px;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-io:active { color: white; border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.05); }

        .opt-light { color: #ffe0b2; }
        .opt-medium { color: #ffccbc; }
        .opt-dark { color: #d7ccc8; }

        .status-toast {
            position: fixed; top: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 20px; border-radius: 20px; color: white; font-size: 12px; letter-spacing: 1px;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 500; font-weight: 600;
        }
        
        .loading-screen {
            position: fixed; inset: 0; z-index: 1000;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            color: rgba(255,255,255,0.2); font-size: 12px; letter-spacing: 2px;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

<div class="search-overlay" id="searchOverlay">
    <div class="search-capsule" id="searchCapsule">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" class="search-input-box" id="searchInput" placeholder="">
    </div>
</div>

<div class="loading-screen" id="loadingText">INITIALIZING...</div>
<div class="status-toast" id="statusToast">SAVED</div>

<div class="app-container">
    <div class="card-scroller" id="scroller">
    </div>
</div>

<script>
    const DB_NAME = 'BeanDance_V46_Stable';
    const DB_VERSION = 1;
    const STORE_NAME = 'coffees';
    const SEARCH_BG_ID = 0;
    const METADATA_ID = -1;
    const CARD_FULL_WIDTH = 384;
    const ROASTS = ['light', 'medium', 'dark'];

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }

    function escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, ch => (
            {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]
        ));
    }

    function normalizeBean(b) {
        if (!Array.isArray(b.brews)) b.brews = [];
        if (typeof b.roastDate !== 'string') b.roastDate = '';
        if (!ROASTS.includes(b.roast)) b.roast = 'medium';
        return b;
    }

    function ratioText(powder, liquid) {
        const p = parseFloat(powder), l = parseFloat(liquid);
        if (!p || !l || p <= 0 || l <= 0) return '—';
        return '1 : ' + (l / p).toFixed(1);
    }

    function beanDays(roastDate) {
        if (!roastDate) return null;
        const t = new Date(roastDate + 'T00:00:00').getTime();
        if (isNaN(t)) return null;
        const d = Math.floor((Date.now() - t) / 86400000);
        return d >= 0 ? d : null;
    }

    function frontSubtitle(b) {
        const parts = [b.roast.toUpperCase()];
        const r = ratioText(b.powder, b.liquid);
        if (r !== '—') parts.push(r.replace(/\s/g, ''));
        const days = beanDays(b.roastDate);
        if (days !== null) parts.push('DAY ' + days);
        return parts.join(' · ');
    }

    function fmtBrewDate(ts) {
        const d = new Date(ts);
        return `${d.getMonth() + 1}/${d.getDate()}`;
    }

    let db;
    let allCoffeesCache = [];
    let searchBgBlob = null;
    let appMetadata = { title: 'BeanDance', author: 'by CAIMAN' }; 
    
    let debounceMap = new Map();
    // 移除复杂的 revealTimer，回归原生行为
    let menuTimer; 
    
    const scroller = document.getElementById('scroller');
    const toast = document.getElementById('statusToast');
    const loader = document.getElementById('loadingText');
    const searchOverlay = document.getElementById('searchOverlay');
    const searchInput = document.getElementById('searchInput');
    const searchCapsule = document.getElementById('searchCapsule');

    function showToast(msg) {
        toast.innerText = msg;
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2000);
    }

    function initDB() {
        const dbPromise = new Promise((resolve) => {
            if (!window.indexedDB) return resolve(null);
            try {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                };
                request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                request.onerror = () => resolve(null); 
                request.onblocked = () => resolve(null);
            } catch (e) { resolve(null); }
        });
        const timeoutPromise = new Promise(resolve => setTimeout(() => resolve(null), 1000));
        return Promise.race([dbPromise, timeoutPromise]);
    }

    function getAllCoffees() {
        return new Promise((resolve) => {
            if (!db) return resolve([]);
            try {
                const tx = db.transaction(STORE_NAME, 'readonly');
                tx.objectStore(STORE_NAME).getAll().onsuccess = (e) => resolve(e.target.result);
            } catch(e) { resolve([]); }
        });
    }

    function scheduleSave(key, fn) {
        if (!db) return; 
        if (debounceMap.has(key)) clearTimeout(debounceMap.get(key).timer);
        const timer = setTimeout(() => {
            fn(); 
            debounceMap.delete(key);
            showToast('SAVED');
        }, 500);
        debounceMap.set(key, { timer, fn });
    }

    function flushSave(key) {
        if (debounceMap.has(key)) {
            const task = debounceMap.get(key);
            clearTimeout(task.timer); 
            task.fn(); 
            debounceMap.delete(key);
            showToast('SAVED (INSTANT)');
        }
    }

    function updateMetadata(field, value) {
        appMetadata[field] = value;
        scheduleSave('meta', () => saveToDB(METADATA_ID, appMetadata));
    }

    function updateCoffee(id, field, value) {
        const item = allCoffeesCache.find(c => c.id === id);
        if (item) {
            item[field] = value;
            scheduleSave(`coffee-${id}`, () => saveToDB(id, item));
        }
    }

    function saveToDB(id, data) {
        if (!db) return;
        try {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const safeData = { ...data };
            if (id === METADATA_ID || id === SEARCH_BG_ID) {
                store.get(id).onsuccess = (e) => {
                    const record = e.target.result;
                    if(record) store.put({ ...record, ...safeData });
                    else store.add({ id: id, ...safeData });
                };
            } else {
                store.put(safeData);
            }
        } catch(e) { console.error(e); }
    }

    function addCoffee(roast, overrideData = null) {
        let newCoffee = overrideData || {
            name: 'New Coffee',
            powder: '18', liquid: '36', time: '25', grind: '2.0',
            roast: roast || 'medium', roastDate: '', brews: [],
            imageData: null, created: Date.now()
        };
        if (overrideData) delete newCoffee.id;
        normalizeBean(newCoffee);

        if (!db) {
            newCoffee.id = Date.now();
            allCoffeesCache.push(newCoffee);
            renderSingleCard(newCoffee, true);
            if (!overrideData) resetAddMenu();
            return Promise.resolve(newCoffee.id);
        }

        return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.add(newCoffee).onsuccess = (e) => {
                newCoffee.id = e.target.result;
                allCoffeesCache.push(newCoffee);
                renderSingleCard(newCoffee, true);
                if (!overrideData) resetAddMenu();
                resolve(newCoffee.id);
            };
        });
    }

    function resetAddMenu() {
        const addCard = document.querySelector('.card-add');
        if(addCard) {
            addCard.classList.remove('active');
            if (menuTimer) { clearTimeout(menuTimer); menuTimer = null; }
        }
    }

    async function deleteCard(id) {
        if(!db) { 
            allCoffeesCache = allCoffeesCache.filter(c => c.id !== id);
            removeCardDOM(id);
            return;
        }

        const key = `coffee-${id}`;
        if (debounceMap.has(key)) {
            clearTimeout(debounceMap.get(key).timer);
            debounceMap.delete(key);
        }

        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id).onsuccess = () => {
            allCoffeesCache = allCoffeesCache.filter(c => c.id !== id);
            removeCardDOM(id);
        };
    }

    function removeCardDOM(id) {
        const card = document.querySelector(`.card-wrapper[data-id="${id}"]`);
        if(card) {
            const img = card.querySelector('.bg-image');
            if(img && img.src && img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
            card.style.transform = 'scale(0) translateY(50px)';
            card.style.opacity = '0';

    function handleImageUpload(e, id) {
        const file = e.target.files[0];
        if(!file) return;
        showToast('PROCESSING...');
        
        processImage(file).then(blob => {
            if (id === SEARCH_BG_ID) {
                searchBgBlob = blob;
                saveToDB(SEARCH_BG_ID, { imageData: blob });
                updateImageDOM(document.getElementById('search-wrapper'), blob);
            } else {
                const item = allCoffeesCache.find(c => c.id === id);
                if(item) {
                    item.imageData = blob;
                    saveToDB(id, item);
                    updateImageDOM(document.querySelector(`.card-wrapper[data-id="${id}"]`), blob);
                }
            }
            showToast('SAVED');
        }).catch(err => {
            console.error(err);
            showToast('ERROR');
        });
    }

    function updateImageDOM(wrapper, blob) {
        if(!wrapper) return;
        // 不再需要 hideAllIcons()，CSS 会自动处理显隐
        
        const img = wrapper.querySelector('.bg-image');
        if(img) {
            if(img.src && img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
            img.src = URL.createObjectURL(blob);
            img.style.opacity = 1;
            wrapper.classList.add('has-image');
        }
    }

    function processImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxDim = 1200; 
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > maxDim) { h *= maxDim/w; w = maxDim; } } 
                    else { if (h > maxDim) { w *= maxDim/h; h = maxDim; } }
                    canvas.width = w; canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.85);
                };
                img.onerror = () => reject(new Error("Img Error"));
            };
            reader.onerror = () => reject(new Error("File Error"));
        });
    }

    function blobToDataURL(blob) {
        return new Promise((resolve, reject) => {
            const r = new FileReader();
            r.onload = () => resolve(r.result);
            r.onerror = () => reject(new Error('Read Error'));
            r.readAsDataURL(blob);
        });
    }

    async function dataURLToBlob(url) {
        return (await fetch(url)).blob();
    }

    async function handleExport() {
        showToast('EXPORTING...');
        try {
            const beans = [];
            for (const c of allCoffeesCache) {
                const { imageData, ...rest } = c;
                beans.push({ ...rest, image: imageData ? await blobToDataURL(imageData) : null });
            }
            const payload = {
                app: 'BeanDance', version: 2,
                exportedAt: new Date().toISOString(),
                meta: appMetadata,
                searchBg: searchBgBlob ? await blobToDataURL(searchBgBlob) : null,
                beans
            };
            const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `BeanDance_Backup_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('EXPORTED');
        } catch (err) {
            console.error(err);
            showToast('ERROR');
        }
        resetAddMenu();
    }

    function handleImport(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                // 兼容 v1（裸数组、无图）和 v2（含图完整备份）
                const beans = Array.isArray(data) ? data
                    : (data && Array.isArray(data.beans)) ? data.beans : null;
                if (!beans) { alert("Invalid JSON"); resetAddMenu(); return; }

                showToast(`IMPORTING ${beans.length}...`);

                if (!Array.isArray(data)) {
                    if (data.meta) {
                        appMetadata = { ...appMetadata, ...data.meta };
                        saveToDB(METADATA_ID, appMetadata);
                        const titleInput = document.querySelector('.app-brand-title-input');
                        const authorInput = document.querySelector('.app-brand-author-input');
                        if (titleInput) titleInput.value = appMetadata.title;
                        if (authorInput) authorInput.value = appMetadata.author;
                    }
                    if (data.searchBg) {
                        searchBgBlob = await dataURLToBlob(data.searchBg);
                        saveToDB(SEARCH_BG_ID, { imageData: searchBgBlob });
                        updateImageDOM(document.getElementById('search-wrapper'), searchBgBlob);
                    }
                }

                for (const item of beans) {
                    const { image, ...rest } = item;
                    const bean = { ...rest };
                    if (image) bean.imageData = await dataURLToBlob(image);
                    await addCoffee(bean.roast || 'medium', bean);
                }
                showToast('DONE');
            } catch(err) {
                console.error(err);
                alert("Import Failed");
            }
            resetAddMenu();
        };
        reader.readAsText(file);
        e.target.value = '';
    }

    function activateSearch() {
        searchOverlay.classList.add('active');
        searchInput.focus();
    }

    function deactivateSearch() {
        searchOverlay.classList.remove('active');
        searchInput.blur();
    }

    searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const query = searchInput.value.toLowerCase().trim();
            if (!query) return;

            const target = allCoffeesCache.find(c => c.name && c.name.toLowerCase().includes(query));
            
            if (target) {
                const card = document.querySelector(`.card-wrapper[data-id="${target.id}"]`);
                if (card) {
                    card.scrollIntoView({ behavior: 'smooth', inline: 'center' });

                    searchInput.value = ''; 
                }

            }
        }
    });

    // --- 手势识别 ---
    let touchStartX = 0;
    let touchStartY = 0;
    
    scroller.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
    });
    
    scroller.addEventListener('touchend', e => {
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;
        
        const isPullDown = diffY > 60 && Math.abs(diffX) < 50;
        
        if (isPullDown && !searchOverlay.classList.contains('active')) {
            activateSearch();
        }
    });

    searchOverlay.addEventListener('click', (e) => {
        if (e.target === searchOverlay) {
            deactivateSearch();
        }
    });

    function setupDelegation() {
        scroller.addEventListener('click', async (e) => {
            const t = e.target;
            
            // --- 核心修改：上传逻辑 ---
            const uploadBtn = t.closest('.upload-btn');
            if (uploadBtn) {
                // 仅阻止冒泡，防止触发卡片翻转
                // 浏览器原生处理 <label> 点击，自动触发 <input>
                e.stopPropagation();
                // 移除所有 JS 显隐控制，全交给 CSS
                return;
            }

            // --- 3. Other Card Logic ---
            const addCard = t.closest('.card-add');
            if (addCard) {
                if (t.classList.contains('btn-export')) { handleExport(); return; }
                if (t.classList.contains('btn-import')) { document.getElementById('json-import-input').click(); return; }
                if (t.classList.contains('add-menu-btn')) {
                    let roast = 'medium';
                    if (t.classList.contains('opt-light')) roast = 'light';
                    else if (t.classList.contains('opt-dark')) roast = 'dark';
                    addCoffee(roast);
                    return;
                }

                if (menuTimer) clearTimeout(menuTimer);
                addCard.classList.add('active'); 
                
                menuTimer = setTimeout(() => {
                    addCard.classList.remove('active'); 
                    menuTimer = null;
                }, 2000);
                return;
            }

            const wrapper = t.closest('.card-wrapper');
            if (!wrapper || wrapper.id === 'add-card-wrapper') return;

            const dot = t.closest('.roast-dot');
            if (dot) {
                const id = parseInt(wrapper.dataset.id);
                const bean = allCoffeesCache.find(c => c.id === id);
                if (bean && dot.dataset.roast !== bean.roast) {
                    wrapper.classList.remove(`roast-${bean.roast}`);
                    bean.roast = dot.dataset.roast;
                    wrapper.classList.add(`roast-${bean.roast}`);
                    wrapper.querySelectorAll('.roast-dot').forEach(d => d.classList.toggle('selected', d === dot));
                    wrapper.querySelector('.front-sub').innerText = frontSubtitle(bean);
                    scheduleSave(`coffee-${id}`, () => saveToDB(id, bean));
                }
                return;
            }

            if (t.closest('.btn-brew')) {
                const id = parseInt(wrapper.dataset.id);
                const bean = allCoffeesCache.find(c => c.id === id);
                if (bean) {
                    bean.brews.push({
                        date: Date.now(),
                        powder: bean.powder, liquid: bean.liquid,
                        time: bean.time, grind: bean.grind
                    });
                    renderBrews(wrapper, bean);
                    saveToDB(id, bean);
                    showToast('LOGGED ☕');
                }
                return;
            }

            const brewDel = t.closest('.brew-del');
            if (brewDel) {
                const id = parseInt(wrapper.dataset.id);
                const bean = allCoffeesCache.find(c => c.id === id);
                const idx = parseInt(brewDel.closest('.brew-item').dataset.idx);
                if (bean && !isNaN(idx)) {
                    bean.brews.splice(idx, 1);
                    renderBrews(wrapper, bean);
                    saveToDB(id, bean);
                }
                return;
            }

            if (t.closest('input')) return;

            if (t.closest('.btn-delete')) {
                const id = parseInt(wrapper.dataset.id);
                if (confirm('Delete?')) deleteCard(id);
                return;
            }

            if (t.closest('.btn-done')) { wrapper.classList.remove('flipped'); return; }

            if (!t.closest('.card-back')) {
                if (wrapper.id === 'search-wrapper') return;
                if (wrapper.classList.contains('active')) wrapper.classList.toggle('flipped');
                else wrapper.scrollIntoView({behavior:'smooth', inline:'center'});
            }
        });

        scroller.addEventListener('focusout', (e) => {
            const input = e.target;
            if (input.tagName === 'INPUT') {
                const wrapper = input.closest('.card-wrapper');
                let key = null;
                if (input.classList.contains('app-brand-title-input') || input.classList.contains('app-brand-author-input')) {
                    key = 'meta';
                } else if (wrapper) {
                    const id = parseInt(wrapper.dataset.id);
                    if (id > 0) key = `coffee-${id}`;
                }
                if (key) flushSave(key);
            }
        });

        const importInput = document.getElementById('json-import-input');
        if(importInput) importInput.addEventListener('change', handleImport);

        scroller.addEventListener('input', (e) => {
            const input = e.target;
            const wrapper = input.closest('.card-wrapper');
            if(!wrapper) return;

            if (input.classList.contains('app-brand-title-input')) return updateMetadata('title', input.value);
            if (input.classList.contains('app-brand-author-input')) return updateMetadata('author', input.value);

            const id = parseInt(wrapper.dataset.id);
            if(id > 0) {
                if(input.classList.contains('title-input')) {
                    wrapper.querySelector('h2').innerText = input.value || 'Coffee';
                    updateCoffee(id, 'name', input.value);
                } else if(input.dataset.field) {
                    updateCoffee(id, input.dataset.field, input.value);
                    refreshComputed(wrapper, id, input.dataset.field);
                }
            }
        });

        scroller.addEventListener('change', (e) => {
            if(e.target.type === 'file' && (e.target.classList.contains('card-input') || e.target.classList.contains('bg-input'))) {
                const wrapper = e.target.closest('.card-wrapper');
                const id = parseInt(wrapper.dataset.id);
                handleImageUpload(e, id);
                return;
            }
            // iOS 的日期选择器只可靠触发 change
            if (e.target.dataset && e.target.dataset.field === 'roastDate') {
                const wrapper = e.target.closest('.card-wrapper');
                const id = parseInt(wrapper.dataset.id);
                if (id > 0) {
                    updateCoffee(id, 'roastDate', e.target.value);
                    refreshComputed(wrapper, id, 'roastDate');
                }
            }
        });
    }

    // 粉量/液重/烘焙日期变化时，刷新比例行和正面副标题
    function refreshComputed(wrapper, id, field) {
        const bean = allCoffeesCache.find(c => c.id === id);
        if (!bean) return;
        if (field === 'powder' || field === 'liquid') {
            const rd = wrapper.querySelector('.ratio-display');
            if (rd) rd.innerText = ratioText(bean.powder, bean.liquid);
        }
        const sub = wrapper.querySelector('.front-sub');
        if (sub) sub.innerText = frontSubtitle(bean);
    }

    async function initApp() {
        try {
            const q = new URLSearchParams(location.search);
            if (q.has('demo')) {
                allCoffeesCache = getDemoBeans();
                scroller.innerHTML = '';
                renderSearchCard(null);
                allCoffeesCache.forEach(c => renderSingleCard(c));
                renderAddButton();
                const cardIdx = parseInt(q.get('card')) || 1;
                setupDelegation();
                const w = document.querySelector(`.card-wrapper[data-id="${cardIdx}"]`);
                if (w) {
                    if (q.has('flip')) w.classList.add('flipped');
                    const center = () => {
                        scroller.scrollLeft = w.offsetLeft + w.offsetWidth / 2 - window.innerWidth / 2;
                        layoutCards();
                        if (q.has('flip')) w.classList.add('flipped');
                    };
                    center();
                    setTimeout(center, 400);
                }
                layoutCards();
                return;
            }

            await initDB();
            const allData = await getAllCoffees();
            const meta = allData.find(c => c.id === METADATA_ID);
            if(meta) { appMetadata.title = meta.title; appMetadata.author = meta.author; }
            const searchData = allData.find(c => c.id === SEARCH_BG_ID);
            if (searchData && searchData.imageData) searchBgBlob = searchData.imageData;
            allCoffeesCache = allData.filter(c => c.id > 0).map(normalizeBean);
            
            scroller.innerHTML = '';
            renderSearchCard(searchData);
            allCoffeesCache.forEach(c => renderSingleCard(c));
            renderAddButton();

            if (allCoffeesCache.length > 0) {
                scroller.scrollLeft = CARD_FULL_WIDTH - 20; 
            }
            
            setupDelegation();
            layoutCards();

        } catch (e) {
            console.error("Init Error", e);
        } finally {
            loader.style.opacity = '0';
            setTimeout(() => { loader.style.display = 'none'; }, 300);
            scroller.classList.add('visible');
        }
    }

                        <div class="data-list">
                            <div class="data-row"><span class="data-label">粉量</span><div class="data-value-group"><input class="data-input" type="number" data-field="powder" value="${escapeHtml(data.powder)}"><span class="data-unit">g</span></div></div>
                            <div class="data-row"><span class="data-label">液重</span><div class="data-value-group"><input class="data-input" type="number" data-field="liquid" value="${escapeHtml(data.liquid)}"><span class="data-unit">g</span></div></div>
                            <div class="data-row"><span class="data-label">比例</span><div class="data-value-group"><span class="data-static ratio-display">${ratioText(data.powder, data.liquid)}</span></div></div>
                            <div class="data-row"><span class="data-label">时间</span><div class="data-value-group"><input class="data-input" type="number" data-field="time" value="${escapeHtml(data.time)}"><span class="data-unit">s</span></div></div>
                            <div class="data-row"><span class="data-label">研磨度</span><div class="data-value-group"><input class="data-input" type="text" data-field="grind" value="${escapeHtml(grind)}"><span class="data-unit">m</span></div></div>
                            <div class="data-row"><span class="data-label">烘焙日期</span><div class="data-value-group"><input class="data-input date-input" type="date" data-field="roastDate" value="${escapeHtml(data.roastDate)}"></div></div>
                            <div class="data-row"><span class="data-label">烘焙度</span><div class="roast-picker">
                                <span class="roast-dot light ${data.roast === 'light' ? 'selected' : ''}" data-roast="light"></span>
                                <span class="roast-dot medium ${data.roast === 'medium' ? 'selected' : ''}" data-roast="medium"></span>
                                <span class="roast-dot dark ${data.roast === 'dark' ? 'selected' : ''}" data-roast="dark"></span>
                            </div></div>
                        </div>
                        <div class="brew-list"></div>
                    </div>
                    <button class="btn-brew">☕ 记一杯</button>
                    <div class="action-row"><button class="btn-text btn-delete">Delete</button><button class="btn-text btn-done">Done</button></div>
                </div>
            </div>`;

        renderBrews(wrapper, data);

        if (isInsert) {
            scroller.insertBefore(wrapper, document.getElementById('add-card-wrapper'));
            requestAnimationFrame(() => wrapper.scrollIntoView({behavior:'smooth', inline:'center'}));
        } else {
            scroller.appendChild(wrapper);
        }
        wakeAnim();
    }

    function renderBrews(wrapper, bean) {
        const list = wrapper.querySelector('.brew-list');
        if (!list) return;
        if (!bean.brews.length) {
            list.innerHTML = '<div class="brew-empty">还没有冲煮记录</div>';
            return;
        }
        list.innerHTML = bean.brews.slice().reverse().map((b, i) => {
            const idx = bean.brews.length - 1 - i;
            return `<div class="brew-item" data-idx="${idx}">
                <span class="brew-date">${fmtBrewDate(b.date)}</span>
                <span class="brew-params">${escapeHtml(b.powder)}g → ${escapeHtml(b.liquid)}g · ${escapeHtml(b.time)}s · ${escapeHtml(b.grind)}</span>
                <span class="brew-del">×</span>
            </div>`;
        }).join('');
    }

    function renderAddButton() {
        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrapper';
        wrapper.id = 'add-card-wrapper';
        wrapper.innerHTML = `
            <div class="card">
                <div class="card-front">
                    <div class="card-add">
                        <div class="add-icon">+</div>
                        <div class="add-roast-group">
                            <div class="add-menu-btn opt-light" data-roast="light">Light</div>
                            <div class="add-menu-btn opt-medium" data-roast="medium">Medium</div>
                            <div class="add-menu-btn opt-dark" data-roast="dark">Dark</div>
                        </div>
                        <div class="add-io-group">
                            <span class="btn-io btn-import">IMPORT</span>
                            <span class="btn-io btn-export">EXPORT</span>
                            <input type="file" id="json-import-input" accept=".json" hidden>
                        </div>
                    </div>
                </div>
                <div class="card-back" style="display:none"></div>
            </div>`;
        scroller.appendChild(wrapper);
    }

    // 布局计算改为滚动驱动：静止时不再运行 rAF，省电
    function layoutCards() {
        const viewportWidth = window.innerWidth;
        const center = viewportWidth / 2;

        for (const card of scroller.children) {
            if (card.style.display === 'none') continue;

            // 缩放以中心为原点，不影响几何中心，rect 中心是稳定的
            const rect = card.getBoundingClientRect();
            const cardCenterX = rect.left + rect.width / 2;

            const dist = Math.abs(center - cardCenterX);
            const normalizedDist = dist / (viewportWidth * 0.6);

            const scale = Math.max(0.88, 1 - Math.pow(normalizedDist, 2) * 0.15);
            const opacity = Math.max(0.4, 1 - Math.pow(normalizedDist, 1.5) * 0.7);

            card.style.transform = `scale(${scale})`;
            card.style.opacity = opacity;

            if (dist < 150) {
                card.classList.add('active');
                card.style.opacity = 1;
            } else {
                card.classList.remove('active');
                if(card.classList.contains('flipped')) card.classList.remove('flipped');
            }
        }
    }

    let animRafId = null;
    let animSettleTimer = null;

    function animPump() {
        layoutCards();
        animRafId = requestAnimationFrame(animPump);
    }

    function wakeAnim() {
        if (animRafId === null) animPump();
        clearTimeout(animSettleTimer);
        // 滚动停止后补跑一小段让 snap 动画收尾，然后彻底停止
        animSettleTimer = setTimeout(() => {
            cancelAnimationFrame(animRafId);
            animRafId = null;
            layoutCards();
        }, 250);
    }

    scroller.addEventListener('scroll', wakeAnim, { passive: true });
    window.addEventListener('resize', wakeAnim);

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initApp);
    } else {
        initApp();
    }

</script>
</body>
</html>
